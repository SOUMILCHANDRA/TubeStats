<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
    <title>YT Music Wrapped Pro — TubeStats</title>
    <link rel="icon" href="https://upload.wikimedia.org/wikipedia/commons/6/6a/Youtube_Music_icon.svg" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@stlite/browser/build/stlite.css" />
    <style>
      body, html {
        margin: 0;
        padding: 0;
        background-color: #0E1117;
        color: #F0F6FC;
        height: 100%;
        overflow: hidden;
      }
      #root {
        height: 100%;
      }
      #loading-screen {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        background: #0E1117;
        color: #FFFFFF;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        z-index: 9999;
      }
      .spinner {
        width: 48px;
        height: 48px;
        border: 4px solid rgba(255, 0, 85, 0.2);
        border-top-color: #FF0055;
        border-radius: 50%;
        animation: spin 1s linear infinite;
        margin-bottom: 20px;
      }
      @keyframes spin {
        to { transform: rotate(360deg); }
      }
    </style>
  </head>
  <body>
    <div id="loading-screen">
      <div class="spinner"></div>
      <h2 style="margin: 0; font-size: 26px; font-weight: 800; background: linear-gradient(90deg, #FF0055, #00F0FF); -webkit-background-clip: text; -webkit-text-fill-color: transparent;">
        YT Music Wrapped Pro
      </h2>
      <p style="color: #8B949E; font-size: 14px; margin-top: 10px;">
        Starting client-side Python & WebAssembly engine...
      </p>
      <p style="color: #6E7681; font-size: 12px; margin-top: 4px;">
        100% private. All processing runs directly inside your browser.
      </p>
    </div>
    <div id="root"></div>
    <script type="module">
      import { mount } from "https://cdn.jsdelivr.net/npm/@stlite/browser/build/stlite.js";
      mount(
        {
          requirements: ["pandas", "plotly", "numpy"],
          entrypoint: "app.py",
          files: {
            "app.py": { url: "./app.py" },
            "charts.py": { url: "./charts.py" },
            "cleaner.py": { url: "./cleaner.py" },
            "metrics.py": { url: "./metrics.py" },
            "parser.py": { url: "./parser.py" },
            "sample_watch_history.json": { url: "./sample_watch_history.json" }
          },
        },
        document.getElementById("root")
      ).then(() => {
        const loader = document.getElementById("loading-screen");
        if (loader) {
          loader.style.opacity = "0";
          loader.style.transition = "opacity 0.4s ease";
          setTimeout(() => loader.remove(), 400);
        }
      });
    </script>
  </body>
</html>
